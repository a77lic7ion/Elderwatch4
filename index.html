<!doctype html>
<html lang="en" data-night="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ElderWatch — Daily Frailcare Wellness Check-in</title>
    <meta name="description" content="Daily wellness check-in Progressive Web App for frailcare and retirement homes with 1-tap resident terminal and live staff triage dashboard." />
    <meta property="og:title" content="ElderWatch — Daily Frailcare Wellness Check-in" />
    <meta property="og:description" content="Daily wellness check-in Progressive Web App for frailcare and retirement homes with 1-tap resident terminal and live staff triage dashboard." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Typography: Atkinson Hyperlegible & Bricolage Grotesque -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">

    <!-- PWA meta tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#121815" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ElderWatch" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/elderwatch-logo.svg" />
    <link rel="alternate icon" type="image/png" href="/pwa-192x192.png" />
  </head>
  <body class="bg-[#121815] text-[#F2EEE5] antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('ElderWatch SW registered:', reg.scope))
            .catch((err) => console.log('ElderWatch SW registration error:', err));
        });
      }
    </script>
  </body>
</html>
